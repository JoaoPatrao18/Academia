<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="manifest" href="manifest.json">

<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root {
  --bg: #1B1B1D;
  --surface: #222225;
  --surface-2: #2B2B2F;
  --chalk: #F1EFE9;
  --muted: #93939A;
  --line: #38383D;
  --red: #E4402E;
  --blue: #3B7CF0;
  --yellow: #E4B92E;
  --green: #3EA35B;
  --plate5: #D8D5CC;
  --font-display: 'Oswald', 'Arial Narrow', sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--chalk);
  font-family: var(--font-body);
  margin: 0;
  min-height: 100%;
}
#root {
  padding: 18px 14px 40px;
  max-width: 480px;
  margin: 0 auto;
}

.th-eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
.th-title { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: 0.01em; text-transform: uppercase; margin: 0 0 2px; }
.th-legend { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 16px; }

.th-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; }
.th-tabs::-webkit-scrollbar { display: none; }
.th-tab { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: none; padding: 4px 2px 0; cursor: pointer; min-width: 44px; color: var(--muted); }
.th-tab-badge { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-weight: 600; font-size: 11px; border: 2px solid var(--line); color: var(--chalk); position: relative; }
.th-tab[data-active="true"] .th-tab-badge { transform: scale(1.08); }
.th-tab-today::after { content: ''; position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--chalk); }
.th-tab-label { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
.th-tab[data-active="true"] .th-tab-label { color: var(--chalk); }

.th-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.th-day-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.th-day-badge-big { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-weight: 600; font-size: 14px; flex-shrink: 0; border: 2px solid transparent; }
.th-day-badge-lane { width: 52px; height: 52px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-weight: 600; font-size: 12px; flex-shrink: 0; border: 2px solid transparent; }
.th-day-name { font-family: var(--font-display); font-weight: 700; font-size: 22px; text-transform: uppercase; line-height: 1.05; }
.th-day-focus { font-size: 13px; color: var(--muted); margin-top: 2px; }

.th-section-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
.th-section-label:first-of-type { margin-top: 0; }

.th-ex { border-top: 1px solid var(--line); padding: 12px 0; }
.th-ex:first-of-type { border-top: none; padding-top: 0; }
.th-ex-name { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
.th-ex-note { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.th-ex-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.th-ex-scheme { font-family: var(--font-mono); font-size: 13px; color: var(--chalk); background: var(--surface-2); border-radius: 6px; padding: 3px 8px; }
.th-dots { display: flex; gap: 7px; flex-wrap: wrap; }
.th-dot { min-width: 22px; height: 22px; padding: 0 4px; border-radius: 11px; border: 2px solid var(--line); background: none; cursor: pointer; font-family: var(--font-mono); font-size: 9px; color: var(--chalk); }
.th-dot[data-done="true"] { border-color: transparent; }
.th-suggestion { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 4px; }

.th-toggle-row { display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap; }
.th-alt-toggle { font-family: var(--font-mono); font-size: 11px; color: var(--muted); background: none; border: none; padding: 0; cursor: pointer; text-transform: uppercase; letter-spacing: 0.06em; }
.th-alt-list { margin-top: 6px; padding-left: 16px; font-size: 13px; color: var(--chalk); display: none; }
.th-alt-list[data-open="true"] { display: block; }
.th-alt-list li { margin-bottom: 4px; color: #C9C7C1; line-height: 1.4; }
.th-alt-link { display: inline-flex; align-items: center; gap: 6px; color: #C9C7C1; text-decoration: none; }
.th-alt-play { font-size: 9px; color: var(--muted); }

.th-video-link { display: flex; align-items: center; gap: 10px; margin-top: 10px; text-decoration: none; background: var(--surface-2); border-radius: 8px; padding: 6px; border: 1px solid var(--line); }
.th-video-thumb { width: 64px; height: 36px; object-fit: cover; border-radius: 4px; background: var(--bg); flex-shrink: 0; }
.th-video-play { color: var(--chalk); font-size: 11px; opacity: 0.7; }
.th-video-label { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

.th-diagram { display: none; margin-top: 10px; background: var(--surface-2); border-radius: 8px; padding: 8px; color: var(--chalk); }
.th-diagram[data-open="true"] { display: block; }
.th-diagram svg { width: 100%; height: auto; display: block; }

.th-run-box { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; }
.th-run-num { font-family: var(--font-mono); font-weight: 600; font-size: 40px; line-height: 1; }
.th-run-unit { font-family: var(--font-mono); font-size: 14px; color: var(--muted); }
.th-run-desc { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
.th-run-log-btn { margin-top: 12px; width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--chalk); font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; }
.th-run-logged { margin-top: 10px; font-size: 13px; color: var(--green); font-family: var(--font-mono); }

.th-week-stepper { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.th-step-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); color: var(--chalk); font-size: 16px; font-family: var(--font-mono); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.th-step-btn:active { background: var(--line); }
.th-week-label { font-family: var(--font-mono); font-size: 12px; color: var(--muted); flex: 1; }
.th-week-label b { color: var(--chalk); }
.th-recuo-tag { font-family: var(--font-mono); font-size: 10px; color: var(--bg); background: var(--yellow); padding: 2px 6px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }

.th-rest { text-align: center; padding: 30px 10px; }
.th-rest-title { font-family: var(--font-display); font-size: 20px; text-transform: uppercase; margin-bottom: 6px; }
.th-rest-sub { font-size: 13px; color: var(--muted); }

.th-hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: 16px; line-height: 1.5; }
.th-loading { text-align: center; padding: 60px 10px; color: var(--muted); font-family: var(--font-mono); font-size: 13px; }

/* nav / progress link */
.th-nav-row { display: flex; gap: 8px; margin-bottom: 14px; }
.th-nav-btn { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; flex: 1; }
.th-live-btn { width: 100%; margin-top: 14px; padding: 12px; border-radius: 8px; border: 1px solid var(--red); background: transparent; color: var(--red); font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; }
.th-back-btn { font-family: var(--font-mono); font-size: 11px; color: var(--muted); background: none; border: none; padding: 0; margin-bottom: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; }

/* history / chart */
.th-history { margin-top: 8px; display: none; }
.th-history[data-open="true"] { display: block; }
.th-history-empty { font-size: 12px; color: var(--muted); padding: 8px 0; }
.th-history-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 11px; margin-bottom: 10px; }
.th-history-table th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 6px; border-bottom: 1px solid var(--line); text-transform: uppercase; letter-spacing: 0.04em; font-size: 10px; }
.th-history-table td { padding: 4px 6px; border-bottom: 1px solid var(--line); color: var(--chalk); }
.th-history canvas { max-height: 160px; }

/* toast (recorde pessoal) */
.th-toast { position: fixed; left: 50%; bottom: -80px; transform: translateX(-50%); background: var(--yellow); color: var(--bg); font-family: var(--font-mono); font-weight: 600; font-size: 13px; padding: 12px 18px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); transition: bottom 0.25s ease; z-index: 200; white-space: nowrap; }
.th-toast.show { bottom: 24px; }

/* live workout mode */
.th-live-overlay { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 100; flex-direction: column; padding: 20px 18px; }
.th-live-overlay[data-open="true"] { display: flex; }
.th-live-close { align-self: flex-end; background: none; border: 1px solid var(--line); color: var(--chalk); border-radius: 50%; width: 36px; height: 36px; font-size: 16px; cursor: pointer; }
#liveContent { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 10px; }
.th-live-counter { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.th-live-name { font-family: var(--font-display); font-weight: 700; font-size: 30px; text-transform: uppercase; line-height: 1.1; }
.th-live-scheme { font-family: var(--font-mono); font-size: 16px; color: var(--muted); }
.th-live-dots { justify-content: center; margin-top: 14px; }
.th-live-dots .th-dot { min-width: 44px; height: 44px; font-size: 13px; }
.th-live-nav { display: flex; gap: 12px; margin-top: 20px; }
.th-live-nav-btn { flex: 1; padding: 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--chalk); font-family: var(--font-mono); font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; }
.th-live-nav-btn:disabled { opacity: 0.35; }

/* streak grid */
.th-streak-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.th-streak-count { font-family: var(--font-mono); font-size: 13px; color: var(--chalk); }
.th-streak-count b { color: var(--green); font-size: 18px; }
.th-streak-grid { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 3px; overflow-x: auto; padding-bottom: 4px; }
.th-streak-cell { width: 11px; height: 11px; border-radius: 2px; background: var(--surface-2); }
.th-streak-cell[data-level="1"] { background: #2E5B3B; }
.th-streak-cell[data-level="2"] { background: #3A8250; }
.th-streak-cell[data-level="3"] { background: var(--green); }
.th-streak-cell[data-level="skip"] { background: var(--muted); opacity: 0.4; }

/* body measurements */
.th-body-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.th-body-form input { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; color: var(--chalk); font-family: var(--font-mono); font-size: 13px; width: 100%; }
.th-body-form input[type="date"] { grid-column: 1 / -1; }
.th-body-form button { grid-column: 1 / -1; padding: 12px; border-radius: 8px; border: none; background: var(--blue); color: #fff; font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; }
.th-body-list { margin-top: 12px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.th-body-list-row { display: flex; justify-content: space-between; padding: 5px 0; border-top: 1px solid var(--line); }
.th-body-list-row b { color: var(--chalk); }

.th-pr-tag { display: inline-block; margin-left: 6px; font-size: 10px; color: var(--yellow); font-family: var(--font-mono); }

/* weekly summary */
.th-week-summary { display: flex; align-items: center; justify-content: center; gap: 6px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 14px; }
.th-week-summary b { color: var(--green); font-size: 14px; }

/* variant selector */
.th-variant-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.th-variant-label { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.th-variant-select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; color: var(--chalk); font-size: 12px; font-family: var(--font-body); max-width: 220px; }

/* history row actions */
.th-history-actions { white-space: nowrap; }
.th-history-edit, .th-history-del { background: none; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); font-size: 11px; padding: 2px 6px; cursor: pointer; margin-left: 4px; }
.th-history-edit:hover, .th-history-del:hover { color: var(--chalk); }
.th-body-list-row { align-items: center; }

/* weekly summary: visual dots */
.th-week-summary { flex-direction: column; gap: 8px; }
.th-week-dots { display: flex; gap: 6px; justify-content: center; }
.th-week-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); }
.th-week-dot[data-state="done"] { background: var(--green); border-color: transparent; }
.th-week-dot[data-state="skipped"] { background: var(--muted); border-color: transparent; opacity: 0.55; }
.th-week-dot[data-state="missed"] { border-color: var(--red); }
.th-week-dot[data-state="pending"] { border-color: var(--line); }
.th-week-dot[data-state="off"] { border-color: var(--line); opacity: 0.25; }

/* connection error / retry */
.th-retry-btn { font-family: var(--font-mono); font-size: 12px; color: var(--bg); background: var(--yellow); border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer; margin-top: 14px; }

/* weekly comparison text reuses .th-suggestion */

/* stagnation warning */
.th-stagnation { font-size: 12px; color: var(--yellow); margin-top: 6px; font-family: var(--font-mono); line-height: 1.4; }

/* run week suggestion */
.th-run-suggest { margin-top: 10px; background: var(--surface-2); border: 1px solid var(--yellow); border-radius: 8px; padding: 10px; font-size: 12px; color: var(--chalk); line-height: 1.5; }
.th-suggest-btn { margin-left: 6px; background: var(--yellow); color: var(--bg); border: none; border-radius: 6px; padding: 4px 8px; font-family: var(--font-mono); font-size: 11px; cursor: pointer; }

/* skip day */
.th-skip-btn { font-family: var(--font-mono); font-size: 11px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; margin-bottom: 12px; }
.th-skip-note { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-bottom: 12px; }

/* idade (Progresso) */
.th-age-row { display: flex; gap: 8px; margin-bottom: 6px; }
.th-age-row input { flex: 1; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; color: var(--chalk); font-family: var(--font-mono); font-size: 13px; }
.th-age-row button { padding: 10px 14px; border-radius: 8px; border: none; background: var(--blue); color: #fff; font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; }

/* feedback de FC pós-corrida */
.th-hr-feedback { margin-top: 6px; font-size: 12px; font-family: var(--font-mono); }
.th-hr-feedback[data-tone="ok"] { color: var(--green); }
.th-hr-feedback[data-tone="high"] { color: var(--yellow); }
.th-hr-feedback[data-tone="low"] { color: var(--muted); }
</style>
</head>

<script>
// ============================================================
// CONFIGURAÇÃO — cole aqui a URL e a chave "anon" do seu projeto
// Supabase (Project Settings > API). Sem isso o app não conecta.
// ============================================================
const SUPABASE_URL = 'https://gsopyttcjgmxlggcljou.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_sctTSko__bvkZ0EGCaCrMg_8Fh3sJD1';
// Código de acesso enviado em toda leitura/escrita — checado pelas policies
// RLS no banco (função public.has_access_code()). Ver CLAUDE.md para como
// trocar/revogar. Sem o código certo, o banco responde vazio (sem dados).
const ACCESS_CODE = 'lzg0oHK31DLuP_r4dQwXmNfT1cIG2O1Z';
// ============================================================

const BADGE_COLOR_MAP = { yellow: 'var(--yellow)', red: 'var(--red)', green: 'var(--green)', blue: 'var(--blue)' };
const DOW_TO_KEY = ['dom','seg','ter','qua','qui','sex','sab']; // JS getDay() index

let sb = null;
let days = [];
let exercisesByDay = {};   // day_key -> [exercise]
let runByDay = {};         // day_key -> run_session
let runProgression = [];   // index 0 = week 1
let currentWeek = 1;
let activeDayKey = null;
let todayKey = DOW_TO_KEY[new Date().getDay()];
let todayStr = new Date().toISOString().slice(0,10);
let todaySetLogs = {};     // exercise_id -> { setNumber: {weight,reps} }
let lastKnownWeight = {};  // exercise_id -> weight (most recent ever)
let lastSessionRows = {};  // exercise_id -> [{weight,reps,log_date}] all rows of the most recent session
let logsByEx = {};         // exercise_id -> [{weight,reps,log_date}] recent history (up to 400 rows/day)
let stagnantExercises = new Set(); // exercise_id (string) with 3+ sessions with no progress
let connectionOk = false;

let currentView = 'day';   // 'day' | 'progress'
let historyOpen = {};      // exercise_id -> bool
let historyCache = {};     // exercise_id -> set_logs[]
let exCharts = {};         // exercise_id -> Chart instance
let runChartOpen = {};     // day_key -> bool
let runCharts = {};        // day_key -> Chart instance
let bmChart = null;
let toastTimer = null;

let liveList = [];
let liveIndex = 0;
let liveOpen = false;

let selectedVariant = {}; // exercise_id -> alternative name or null (main)
let paceTipOpen = {};     // day_key -> bool
let userAge = null;       // settings.user_age, null se ainda não preenchida

const root = document.getElementById('root');

function themeColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function formatDate(iso) { const [y,m,d] = iso.split('-'); return `${d}/${m}/${y.slice(2)}`; }
function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }

const WEEKDAY_LABELS = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];

function getWeekRange(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const dow = d.getDay(); // 0=dom..6=sab
  const diffToMonday = dow === 0 ? -6 : 1 - dow;
  const monday = new Date(d); monday.setDate(d.getDate() + diffToMonday);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  return { monday, sunday };
}

function isoDate(d) { return d.toISOString().slice(0, 10); }

// ============================================================
// Unidade de pace (min/km vs km/h) — preferência salva no navegador
// ============================================================
let paceUnitMemory = 'minkm'; // fallback quando localStorage não está disponível (modo privado etc.)
function getPaceUnit() { try { return localStorage.getItem('paceUnit') || 'minkm'; } catch (e) { return paceUnitMemory; } }
function setPaceUnit(u) { paceUnitMemory = u; try { localStorage.setItem('paceUnit', u); } catch (e) { /* segue só na memória */ } }
function paceUnitLabel() { return getPaceUnit() === 'kmh' ? 'km/h' : 'min/km'; }
function formatPace(distanceKm, durationMin) {
  if (!distanceKm || !durationMin) return null;
  if (getPaceUnit() === 'kmh') {
    const kmh = distanceKm / (durationMin / 60);
    return kmh.toFixed(1).replace('.', ',') + ' km/h';
  }
  const paceMinPerKm = durationMin / distanceKm;
  const mins = Math.floor(paceMinPerKm);
  const secs = Math.round((paceMinPerKm - mins) * 60);
  return `${mins}:${String(secs).padStart(2, '0')} /km`;
}
function paceValue(distanceKm, durationMin) {
  if (!distanceKm || !durationMin) return null;
  return getPaceUnit() === 'kmh'
    ? +(distanceKm / (durationMin / 60)).toFixed(2)
    : +(durationMin / distanceKm).toFixed(2);
}

// ============================================================
// Zona de frequência cardíaca alvo (60-70% da FC máxima estimada)
// ============================================================
function computeHRZone(age) {
  if (!age) return null;
  const hrMax = 220 - age;
  return { min: Math.round(hrMax * 0.6), max: Math.round(hrMax * 0.7), hrMax };
}

function hrZoneLine() {
  const zone = computeHRZone(userAge);
  if (zone) {
    return `Sua zona alvo: ${zone.min}–${zone.max} bpm (60–70% da sua FC máxima estimada, ${zone.hrMax} bpm).`;
  }
  return `Zona alvo de referência: 60–70% da FC máxima estimada — fórmula: 220 − idade. Preencha sua idade em "Ver progresso" pra ver sua zona calculada.`;
}

function computeHRFeedback(avgHr, age) {
  if (!avgHr || !age) return null;
  const zone = computeHRZone(age);
  if (!zone) return null;
  if (avgHr > zone.max) return { tone: 'high', text: '⚠️ acima da zona alvo — pode ter ido rápido demais' };
  if (avgHr < zone.min) return { tone: 'low', text: 'tranquilo, dentro ou até abaixo do esperado — sem problema nenhum, errar pra esse lado é mais seguro' };
  return { tone: 'ok', text: '✓ ritmo bem calibrado' };
}

async function refreshWeekSummary() {
  const el = document.getElementById('weekSummary');
  if (!el) return;
  try {
    const { monday, sunday } = getWeekRange(todayStr);
    const mondayStr = isoDate(monday);
    const sundayStr = isoDate(sunday);
    const [{ data: setDates, error: e1 }, { data: runDates, error: e2 }, { data: skippedRows, error: e3 }] = await Promise.all([
      sb.from('set_logs').select('log_date').gte('log_date', mondayStr).lte('log_date', sundayStr),
      sb.from('run_logs').select('log_date').gte('log_date', mondayStr).lte('log_date', sundayStr),
      sb.from('skipped_days').select('log_date').gte('log_date', mondayStr).lte('log_date', sundayStr),
    ]);
    if (e1) throw e1;
    if (e2) throw e2;
    if (e3) throw e3;
    const loggedDates = new Set([...(setDates || []), ...(runDates || [])].map(r => r.log_date));
    const skippedDates = new Set((skippedRows || []).map(r => r.log_date));
    const trainingDayKeys = new Set(days.filter(d => d.badge_kind === 'plate' || d.badge_kind === 'lane').map(d => d.key));
    let trainedCount = 0;
    const cells = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday); d.setDate(monday.getDate() + i);
      const key = DOW_TO_KEY[d.getDay()];
      const dStr = isoDate(d);
      let state = 'off';
      if (trainingDayKeys.has(key)) {
        if (loggedDates.has(dStr)) { state = 'done'; trainedCount++; }
        else if (skippedDates.has(dStr)) { state = 'skipped'; }
        else if (dStr < todayStr) { state = 'missed'; }
        else { state = 'pending'; }
      }
      cells.push(`<div class="th-week-dot" data-state="${state}" title="${WEEKDAY_LABELS[i]}"></div>`);
    }
    el.innerHTML = `<div class="th-week-dots">${cells.join('')}</div><div><b>${trainedCount}/${trainingDayKeys.size}</b> dias treinados essa semana</div>`;
  } catch (e) { /* resumo semanal é um bônus; não deve travar o resto do app */ }
}

function fail(msg) {
  root.innerHTML = `<div class="th-loading" style="color:var(--yellow)">⚠️ ${msg}</div>`;
}

function failWithRetry(msg) {
  root.innerHTML = `<div class="th-loading" style="color:var(--yellow)">
    ⚠️ ${msg}
    <div><button class="th-retry-btn" id="retryBtn">Tentar de novo</button></div>
  </div>`;
  document.getElementById('retryBtn').addEventListener('click', () => {
    root.innerHTML = '<div class="th-loading">Carregando…</div>';
    init();
  });
}

function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('TIMEOUT')), ms)),
  ]);
}

async function init() {
  if (SUPABASE_URL.includes('COLE_') || SUPABASE_ANON_KEY.includes('COLE_')) {
    fail('Configuração pendente: abra o código deste arquivo e cole SUPABASE_URL e SUPABASE_ANON_KEY no topo do &lt;script&gt;.');
    return;
  }
  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      global: { headers: { 'x-app-code': ACCESS_CODE } },
    });
  } catch (e) {
    fail('Não consegui iniciar o Supabase. Confira se a URL e a chave estão corretas.');
    return;
  }

  try {
    const [daysRes, exRes, runRes, progRes, settingsRes] = await withTimeout(Promise.all([
      sb.from('days').select('*').order('order_index'),
      sb.from('exercises').select('*').order('order_index'),
      sb.from('run_sessions').select('*'),
      sb.from('run_progression').select('*').order('week'),
      sb.from('settings').select('*').in('key', ['current_week', 'user_age']),
    ]), 9000);
    if (daysRes.error) throw daysRes.error;
    if (exRes.error) throw exRes.error;
    if (runRes.error) throw runRes.error;
    if (progRes.error) throw progRes.error;

    days = daysRes.data || [];
    if (days.length === 0) { fail('Conectei no banco, mas as tabelas estão vazias. Rode o seed.sql no SQL Editor do Supabase.'); return; }

    exercisesByDay = {};
    (exRes.data || []).forEach(e => {
      if (!exercisesByDay[e.day_key]) exercisesByDay[e.day_key] = [];
      exercisesByDay[e.day_key].push(e);
    });
    runByDay = {};
    (runRes.data || []).forEach(r => { runByDay[r.day_key] = r; });
    runProgression = progRes.data || [];
    const settingsRows = settingsRes.data || [];
    const cwRow = settingsRows.find(r => r.key === 'current_week');
    const ageRow = settingsRows.find(r => r.key === 'user_age');
    if (cwRow && cwRow.value) {
      currentWeek = Math.max(1, Math.min(runProgression.length || 10, parseInt(cwRow.value, 10) || 1));
    }
    if (ageRow && ageRow.value) userAge = parseInt(ageRow.value, 10) || null;
    connectionOk = true;
  } catch (e) {
    if (e && e.message === 'TIMEOUT') {
      failWithRetry('Não consegui conectar ao banco. Verifica sua internet.');
    } else {
      failWithRetry('Erro ao conectar no Supabase: ' + (e.message || e) + '. Confira URL/chave e se rodou o schema.sql + seed.sql.');
    }
    return;
  }

  activeDayKey = days.some(d => d.key === todayKey) ? todayKey : days[0].key;
  renderShell();
  await renderDay();
}

async function loadLogsForDay(day) {
  const exList = exercisesByDay[day.key] || [];
  const ids = exList.map(e => e.id);
  if (ids.length === 0) return;
  try {
    const { data: todayLogs } = await sb.from('set_logs').select('*').eq('log_date', todayStr).in('exercise_id', ids);
    todaySetLogs = {};
    (todayLogs || []).forEach(l => {
      if (!todaySetLogs[l.exercise_id]) todaySetLogs[l.exercise_id] = {};
      todaySetLogs[l.exercise_id][l.set_number] = { weight: l.weight, reps: l.reps };
    });

    const { data: histLogs } = await sb.from('set_logs').select('exercise_id, weight, reps, log_date').in('exercise_id', ids).order('log_date', { ascending: false }).limit(400);
    lastKnownWeight = {};
    lastSessionRows = {};
    logsByEx = {};
    const lastSessionDate = {};
    (histLogs || []).forEach(l => {
      if (!(l.exercise_id in lastKnownWeight) && l.weight != null) lastKnownWeight[l.exercise_id] = l.weight;
      if (!(l.exercise_id in lastSessionDate)) lastSessionDate[l.exercise_id] = l.log_date;
      if (l.log_date === lastSessionDate[l.exercise_id]) {
        (lastSessionRows[l.exercise_id] = lastSessionRows[l.exercise_id] || []).push(l);
      }
      (logsByEx[l.exercise_id] = logsByEx[l.exercise_id] || []).push(l);
    });
    stagnantExercises = new Set();
    ids.forEach(id => { if (computeStagnation(logsByEx[id] || [])) stagnantExercises.add(String(id)); });
  } catch (e) { /* logs are a bonus feature; keep app usable even if this fails */ }
}

// ============================================================
// Sugestão de carga (bloco 4)
// ============================================================
function parseTargetReps(scheme) {
  if (!scheme) return null;
  if (/×\s*\d+\s*s\b/i.test(scheme)) return null; // esquema por tempo (ex: 3×40s), não por reps
  const m = scheme.match(/×\s*(\d+)/);
  return m ? parseInt(m[1], 10) : null;
}

function computeSuggestion(ex, sessionRows) {
  if (!sessionRows || !sessionRows.length) return null;
  const weights = sessionRows.map(r => Number(r.weight)).filter(w => !isNaN(w));
  if (!weights.length) return null;
  const lastWeight = Math.max(...weights);
  const targetReps = parseTargetReps(ex.scheme);
  const completedAll = sessionRows.length >= (ex.sets || sessionRows.length) &&
    (targetReps == null || sessionRows.every(r => (r.reps || 0) >= targetReps));
  return { weight: completedAll ? +(lastWeight + 2.5).toFixed(2) : lastWeight, progressed: completedAll };
}

// ============================================================
// Detecção de estagnação (bloco 5)
// ============================================================
function computeStagnation(logs) {
  const byDate = {};
  logs.forEach(l => {
    if (l.weight == null) return;
    const w = Number(l.weight), r = Number(l.reps || 0);
    const cur = byDate[l.log_date];
    if (!cur || w > cur.weight || (w === cur.weight && r > cur.reps)) {
      byDate[l.log_date] = { weight: w, reps: r };
    }
  });
  const dates = Object.keys(byDate).sort();
  if (dates.length < 4) return false;
  const last4 = dates.slice(-4).map(d => byDate[d]);
  for (let i = 1; i < last4.length; i++) {
    const prev = last4[i - 1], cur = last4[i];
    if (cur.weight > prev.weight || (cur.weight === prev.weight && cur.reps > prev.reps)) return false;
  }
  return true;
}

function renderExercise(ex) {
  const doneForEx = todaySetLogs[ex.id] || {};
  const dots = Array.from({ length: ex.sets || 0 }).map((_, i) => {
    const setNum = i + 1;
    const log = doneForEx[setNum];
    const label = log ? `${log.weight}×${log.reps}` : (setNum);
    return `<button class="th-dot" data-ex="${ex.id}" data-set="${setNum}" data-done="${!!log}" style="${log ? 'background:var(--green);border-color:transparent;' : ''}">${label}</button>`;
  }).join('');

  const alt = ex.alternatives || [];
  const how = ex.howto || [];
  const sugg = computeSuggestion(ex, lastSessionRows[ex.id]);
  const suggestion = sugg
    ? `<div class="th-suggestion">sugestão: ${sugg.weight}kg${sugg.progressed ? ' (+2,5kg, completou tudo na última sessão)' : ' (repetir, não completou tudo)'}</div>`
    : (lastKnownWeight[ex.id] ? `<div class="th-suggestion">último registro: ${lastKnownWeight[ex.id]}kg</div>` : '');
  const stagnation = stagnantExercises.has(String(ex.id))
    ? `<div class="th-stagnation">⚠️ sem progresso há 3 treinos — considera trocar a variante ou ajustar o volume</div>`
    : '';
  const selectedName = selectedVariant[ex.id] || '';
  const variantRow = alt.length ? `<div class="th-variant-row">
      <label class="th-variant-label">Fazendo:</label>
      <select class="th-variant-select" data-variant-select="${ex.id}">
        <option value="" ${selectedName === '' ? 'selected' : ''}>${ex.name}</option>
        ${alt.map(a => `<option value="${escapeAttr(a.name)}" ${selectedName === a.name ? 'selected' : ''}>${a.name}</option>`).join('')}
      </select>
    </div>` : '';

  return `<div class="th-ex">
    <div class="th-ex-name">${ex.name}</div>
    ${ex.note ? `<div class="th-ex-note">${ex.note}</div>` : ''}
    ${variantRow}
    <div class="th-ex-row">
      <span class="th-ex-scheme">${ex.scheme || ''}</span>
      <div class="th-dots">${dots}</div>
    </div>
    ${suggestion}
    ${stagnation}
    ${ex.video_id ? `<a class="th-video-link" href="https://www.youtube.com/watch?v=${ex.video_id}" target="_blank" rel="noopener">
      <img class="th-video-thumb" src="https://img.youtube.com/vi/${ex.video_id}/mqdefault.jpg" alt="Vídeo: ${ex.name}" loading="lazy" onerror="this.style.display='none'">
      <span class="th-video-play">▶</span><span class="th-video-label">Assistir vídeo</span>
    </a>` : ''}
    <div class="th-toggle-row">
      ${how.length ? `<button class="th-alt-toggle" data-how-toggle="${ex.id}">Como fazer ⌄</button>` : ''}
      ${alt.length ? `<button class="th-alt-toggle" data-alt-toggle="${ex.id}">Ver alternativas ⌄</button>` : ''}
      ${ex.diagram_svg ? `<button class="th-alt-toggle" data-diagram-toggle="${ex.id}">Ver diagrama ⌄</button>` : ''}
      <button class="th-alt-toggle" data-history-toggle="${ex.id}">${historyOpen[ex.id] ? 'Ocultar histórico ⌃' : 'Ver histórico ⌄'}</button>
    </div>
    ${how.length ? `<ol class="th-alt-list" id="how-${ex.id}">${how.map(h=>`<li>${h}</li>`).join('')}</ol>` : ''}
    ${alt.length ? `<ul class="th-alt-list" id="alt-${ex.id}">${alt.map(a=>`<li><a class="th-alt-link" href="https://www.youtube.com/watch?v=${a.video}" target="_blank" rel="noopener">${a.name} <span class="th-alt-play">▶</span></a></li>`).join('')}</ul>` : ''}
    ${ex.diagram_svg ? `<div class="th-diagram" id="diagram-${ex.id}">${ex.diagram_svg}</div>` : ''}
    <div class="th-history" id="history-${ex.id}" data-open="${historyOpen[ex.id] ? 'true' : 'false'}"><div id="histCompare-${ex.id}"></div><canvas id="histChart-${ex.id}" height="140"></canvas><div id="histTable-${ex.id}"></div></div>

  document.querySelectorAll('.th-dot').forEach(dot => {
    dot.addEventListener('click', () => logSet(dot.getAttribute('data-ex'), parseInt(dot.getAttribute('data-set'), 10)));
  });

  document.querySelectorAll('[data-variant-select]').forEach(sel => {
    sel.addEventListener('change', () => {
      const id = sel.getAttribute('data-variant-select');
      selectedVariant[id] = sel.value || null;
    });
  });

  document.querySelectorAll('[data-history-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-history-toggle');
      const open = historyOpen[id];
      historyOpen[id] = !open;
      btn.textContent = open ? 'Ver histórico ⌄' : 'Ocultar histórico ⌃';
      const box = document.getElementById('history-' + id);
      box.setAttribute('data-open', historyOpen[id] ? 'true' : 'false');
      if (historyOpen[id]) loadAndRenderHistory(id);
    });
  });

  document.querySelectorAll('[data-runchart-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.getAttribute('data-runchart-toggle');
      const open = runChartOpen[key];
      runChartOpen[key] = !open;
      btn.textContent = open ? 'Ver evolução ⌄' : 'Ocultar evolução ⌃';
      const box = document.getElementById('runchart-' + key);
      box.setAttribute('data-open', runChartOpen[key] ? 'true' : 'false');
      if (runChartOpen[key]) loadAndRenderRunChart(key);
    });
  });

  document.querySelectorAll('[data-pacetip-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.getAttribute('data-pacetip-toggle');
      const open = paceTipOpen[key];
      paceTipOpen[key] = !open;
      btn.textContent = open ? '💡 Como calibrar o ritmo ⌄' : 'Ocultar dica ⌃';
      const box = document.getElementById('pacetip-' + key);
      box.setAttribute('data-open', paceTipOpen[key] ? 'true' : 'false');
    });
  });

  const liveStartBtn = document.getElementById('liveStartBtn');
  if (liveStartBtn) liveStartBtn.addEventListener('click', () => openLiveMode(day));

  document.querySelectorAll('.th-history[data-open="true"]').forEach(box => {
    const exId = box.id.startsWith('history-') ? box.id.slice(8) : null;
    if (exId) loadAndRenderHistory(exId);
    const dayKey = box.id.startsWith('runchart-') ? box.id.slice(9) : null;
    if (dayKey) loadAndRenderRunChart(dayKey);
  });

  const runBtn = document.querySelector(`[data-log-run="${day.key}"]`);
  if (runBtn) {
    runBtn.addEventListener('click', async () => {
      const wk = runProgression[currentWeek - 1];
      const run = runByDay[day.key];
      const suggested = wk ? wk[run.field] : '';
      const distInput = prompt('Distância percorrida (km):', suggested || '');
      if (distInput === null) return;
      const durInput = prompt('Tempo (minutos):', '');
      const rpeInput = prompt('Esforço percebido, de 1 (fácil) a 10 (máximo):', '');
      const hrInput = prompt('Frequência cardíaca média (bpm), se tiver relógio — deixe em branco se não souber:', '');
      const distance_km = parseFloat((distInput || '0').replace(',', '.')) || null;
      const duration_min = parseFloat((durInput || '').replace(',', '.')) || null;
      const rpe = parseInt(rpeInput, 10) || null;
      const avg_heart_rate = hrInput && hrInput.trim() !== '' ? parseInt(hrInput, 10) || null : null;
      if (!confirm(`Confirmar corrida: ${distance_km ?? '—'}km${duration_min ? ' em ' + duration_min + 'min' : ''}${rpe ? ' · RPE ' + rpe : ''}${avg_heart_rate ? ' · FC média ' + avg_heart_rate + 'bpm' : ''}?`)) return;
      try {
        const { error } = await sb.from('run_logs').insert({ day_key: day.key, log_date: todayStr, distance_km, duration_min, rpe, avg_heart_rate });
        if (error) throw error;
        setStatus(true);
        const feedback = computeHRFeedback(avg_heart_rate, userAge);
        document.getElementById('runLogged-' + day.key).innerHTML =
          `<div class="th-run-logged">✓ registrado: ${distance_km}km${duration_min ? ' em ' + duration_min + 'min' : ''}${rpe ? ' · RPE ' + rpe : ''}${avg_heart_rate ? ' · FC média ' + avg_heart_rate + 'bpm' : ''}</div>` +
          (feedback ? `<div class="th-hr-feedback" data-tone="${feedback.tone}">${feedback.text}</div>` : '');
        refreshWeekSummary();
      } catch (e) { setStatus(false, 'Não consegui salvar a corrida: ' + (e.message || e)); }
    });
  }

  const wMinus = document.getElementById('weekMinus');
  const wPlus = document.getElementById('weekPlus');
  if (wMinus) wMinus.addEventListener('click', () => changeWeek(-1));
  if (wPlus) wPlus.addEventListener('click', () => changeWeek(1));

  const paceToggleBtn = document.querySelector(`[data-pace-toggle="${day.key}"]`);
  if (paceToggleBtn) {
    paceToggleBtn.addEventListener('click', () => {
      setPaceUnit(getPaceUnit() === 'kmh' ? 'minkm' : 'kmh');
      renderDay();
    });
  }
}

async function changeWeek(delta) {
  currentWeek = Math.max(1, Math.min(runProgression.length, currentWeek + delta));
  try {
    const { error } = await sb.from('settings').upsert({ key: 'current_week', value: String(currentWeek) });
    if (error) throw error;
    setStatus(true);
  } catch (e) { setStatus(false, 'Semana mudou aqui, mas não salvou no banco: ' + (e.message || e)); }
  renderDay();
}

function setStatus(ok, msg) {
  const el = document.getElementById('thStatus');
  if (!el) return;
  el.textContent = ok ? 'Conectado ao banco ✓' : ('⚠️ ' + (msg || 'Falha ao salvar.'));
  el.style.color = ok ? 'var(--muted)' : 'var(--yellow)';
}

// ============================================================
// Registro de série + recorde pessoal
// ============================================================
async function logSet(exId, setNum) {
  const prevLog = (todaySetLogs[exId] || {})[setNum];
  let suggestedWeight = prevLog ? prevLog.weight : null;
  if (suggestedWeight == null) {
    const ex = (exercisesByDay[activeDayKey] || []).find(e => String(e.id) === String(exId));
    const sugg = ex ? computeSuggestion(ex, lastSessionRows[exId]) : null;
    suggestedWeight = sugg ? sugg.weight : (lastKnownWeight[exId] || '');
  }
  const input = prompt('Peso × reps (ex: 60x8)', suggestedWeight ? `${suggestedWeight}x` : '');
  if (input === null) return;
  const m = input.match(/([\d.,]+)\s*[x×]\s*(\d+)/i);
  if (!m) { alert('Não entendi. Use o formato 60x8 (peso x repetições).'); return; }
  const weight = parseFloat(m[1].replace(',', '.'));
  const reps = parseInt(m[2], 10);
  const variant = selectedVariant[exId] || null;

  if (!confirm(`Confirmar: ${weight}kg × ${reps} reps${variant ? ' — ' + variant + ' (alt)' : ''}?`)) return;

  let isRecord = false;
  try {
    const { data: bestRows } = await sb.from('set_logs').select('weight').eq('exercise_id', exId).gte('reps', reps).order('weight', { ascending: false }).limit(1);
    const bestWeight = bestRows && bestRows[0] ? Number(bestRows[0].weight) : null;
    isRecord = bestWeight === null || weight > bestWeight;
  } catch (e) { /* PR check is a bonus; ignore failures */ }

  try {
    const { error } = await sb.from('set_logs')
      .upsert({ exercise_id: exId, set_number: setNum, weight, reps, log_date: todayStr, variant_name: variant }, { onConflict: 'exercise_id,set_number,log_date' });
    if (error) throw error;
    setStatus(true);
    if (isRecord) {
      const ex = (exercisesByDay[activeDayKey] || []).find(e => String(e.id) === String(exId));
      showToast(`🏆 novo recorde! ${ex ? ex.name + ' — ' : ''}${weight}kg × ${reps}`);
    }
    delete historyCache[exId];
  } catch (e) { setStatus(false, 'Não consegui salvar essa série: ' + (e.message || e)); }

  await renderDay();
  if (liveOpen) renderLive();
  refreshWeekSummary();
}

async function editSetLog(logId, exId) {
  const logs = historyCache[exId] || [];
  const row = logs.find(l => String(l.id) === String(logId));
  if (!row) return;
  const input = prompt('Peso × reps (ex: 60x8)', row.weight != null ? `${row.weight}x${row.reps != null ? row.reps : ''}` : '');
  if (input === null) return;
  const m = input.match(/([\d.,]+)\s*[x×]\s*(\d+)/i);
  if (!m) { alert('Não entendi. Use o formato 60x8 (peso x repetições).'); return; }
  const weight = parseFloat(m[1].replace(',', '.'));
  const reps = parseInt(m[2], 10);
  if (!confirm(`Confirmar edição: ${weight}kg × ${reps} reps em ${formatDate(row.log_date)}?`)) return;
  try {
    const { error } = await sb.from('set_logs').update({ weight, reps }).eq('id', logId);
    if (error) throw error;
    setStatus(true);
    delete historyCache[exId];
    await loadAndRenderHistory(exId);
    await renderDay();
    refreshWeekSummary();
  } catch (e) { setStatus(false, 'Não consegui editar essa série: ' + (e.message || e)); }
}

async function deleteSetLog(logId, exId) {
  if (!confirm('Apagar esse registro? Essa ação não pode ser desfeita.')) return;
  try {
    const { error } = await sb.from('set_logs').delete().eq('id', logId);
    if (error) throw error;
    setStatus(true);
    delete historyCache[exId];
    await loadAndRenderHistory(exId);
    await renderDay();
    refreshWeekSummary();
  } catch (e) { setStatus(false, 'Não consegui apagar esse registro: ' + (e.message || e)); }
}

// ============================================================
// Histórico + gráfico de evolução por exercício
// ============================================================
async function loadAndRenderHistory(exId) {
  const tableEl = document.getElementById('histTable-' + exId);
  const canvasEl = document.getElementById('histChart-' + exId);
  if (!tableEl || !canvasEl) return;
  try {
    if (!historyCache[exId]) {
      const { data, error } = await sb.from('set_logs').select('*').eq('exercise_id', exId).order('log_date', { ascending: false }).order('set_number', { ascending: true });
      if (error) throw error;
      historyCache[exId] = data || [];
    }
    const logs = historyCache[exId];
    if (!logs.length) {
      tableEl.innerHTML = '<div class="th-history-empty">Ainda sem histórico registrado.</div>';
      canvasEl.style.display = 'none';
      return;
    }
    canvasEl.style.display = 'block';

    const compareEl = document.getElementById('histCompare-' + exId);
    if (compareEl) {
      const { monday, sunday } = getWeekRange(todayStr);
      const prevMonday = new Date(monday); prevMonday.setDate(monday.getDate() - 7);
      const prevSunday = new Date(sunday); prevSunday.setDate(sunday.getDate() - 7);
      const mondayStr = isoDate(monday), sundayStr = isoDate(sunday);
      const prevMondayStr = isoDate(prevMonday), prevSundayStr = isoDate(prevSunday);
      const weekAvg = (from, to) => {
        const rows = logs.filter(l => l.weight != null && l.log_date >= from && l.log_date <= to);
        if (!rows.length) return null;
        return rows.reduce((s, l) => s + Number(l.weight), 0) / rows.length;
      };
      const avgThis = weekAvg(mondayStr, sundayStr);
      const avgLast = weekAvg(prevMondayStr, prevSundayStr);
      if (avgThis != null && avgLast != null) {
        const diff = avgThis - avgLast;
        compareEl.innerHTML = `<div class="th-suggestion">essa semana: ${avgThis.toFixed(1)}kg · semana passada: ${avgLast.toFixed(1)}kg (${diff >= 0 ? '+' : ''}${diff.toFixed(1)}kg)</div>`;
      } else {
        compareEl.innerHTML = '';
      }
    }

    tableEl.innerHTML = `<table class="th-history-table"><thead><tr><th>Data</th><th>Série</th><th>Peso</th><th>Reps</th><th>Variante</th><th></th></tr></thead><tbody>
      ${logs.map(l => `<tr>
        <td>${formatDate(l.log_date)}</td>
        <td>${l.set_number}</td>
        <td>${l.weight != null ? l.weight + 'kg' : '—'}</td>
        <td>${l.reps != null ? l.reps : '—'}</td>
        <td>${l.variant_name ? l.variant_name + ' (alt)' : '—'}</td>
        <td class="th-history-actions">
          <button class="th-history-edit" data-edit-set="${l.id}">✎</button>
          <button class="th-history-del" data-del-set="${l.id}">🗑</button>
        </td>
      </tr>`).join('')}
    </tbody></table>`;
    tableEl.querySelectorAll('[data-edit-set]').forEach(btn => btn.addEventListener('click', () => editSetLog(btn.getAttribute('data-edit-set'), exId)));
    tableEl.querySelectorAll('[data-del-set]').forEach(btn => btn.addEventListener('click', () => deleteSetLog(btn.getAttribute('data-del-set'), exId)));

    const byDate = {};
    logs.forEach(l => {
      if (l.weight == null) return;
      if (!(l.log_date in byDate) || l.weight > byDate[l.log_date].weight) {
        byDate[l.log_date] = { weight: Number(l.weight), variant: l.variant_name || null };
      }
    });
    const dates = Object.keys(byDate).sort();

    if (exCharts[exId]) exCharts[exId].destroy();
    exCharts[exId] = new Chart(canvasEl.getContext('2d'), {
      type: 'line',
      data: {
        labels: dates.map(formatDate),
        datasets: [{
          label: 'Peso máx (kg)',
          data: dates.map(d => byDate[d].weight),
          borderColor: themeColor('--yellow'),
          backgroundColor: themeColor('--yellow'),
          tension: 0.25,
          pointRadius: 3,
        }],
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const v = byDate[dates[ctx.dataIndex]].variant;
                return `${ctx.parsed.y}kg${v ? ' — ' + v + ' (alt)' : ''}`;
              },
            },
          },
        },
        scales: {
          x: { ticks: { color: themeColor('--muted'), font: { size: 10 } }, grid: { color: themeColor('--line') } },
          y: { ticks: { color: themeColor('--muted'), font: { size: 10 } }, grid: { color: themeColor('--line') } },
        },
      },
    });
  } catch (e) {
    tableEl.innerHTML = `<div class="th-history-empty">Não consegui carregar o histórico: ${e.message || e}</div>`;
  }
}

// ============================================================
// Comparação semanal da corrida (bloco 3) + sugestão de semana (bloco 6)
// ============================================================
async function loadAndRenderRunComparison(dayKey) {
  const el = document.getElementById('runCompare-' + dayKey);
  if (!el) return;
  try {
    const { monday, sunday } = getWeekRange(todayStr);
    const prevMonday = new Date(monday); prevMonday.setDate(monday.getDate() - 7);
    const mondayStr = isoDate(monday), sundayStr = isoDate(sunday);
    const prevMondayStr = isoDate(prevMonday);
    const { data, error } = await sb.from('run_logs').select('log_date, distance_km, duration_min')
      .eq('day_key', dayKey).gte('log_date', prevMondayStr).lte('log_date', sundayStr);
    if (error) throw error;
    const rows = data || [];
    const thisWeek = rows.filter(r => r.log_date >= mondayStr && r.log_date <= sundayStr && r.distance_km != null);
    const prevSundayStr = isoDate(new Date(monday.getTime() - 86400000));
    const lastWeek = rows.filter(r => r.log_date >= prevMondayStr && r.log_date <= prevSundayStr && r.distance_km != null);
    if (!thisWeek.length || !lastWeek.length) { el.innerHTML = ''; return; }
    const totals = arr => arr.reduce((acc, r) => {
      acc.dist += Number(r.distance_km) || 0;
      acc.dur += Number(r.duration_min) || 0;
      acc.n++;
      return acc;
    }, { dist: 0, dur: 0, n: 0 });
    const t = totals(thisWeek), l = totals(lastWeek);
    const avgDistThis = t.dist / t.n, avgDistLast = l.dist / l.n;
    const diffDist = avgDistThis - avgDistLast;
    let paceCompare = '';
    if (t.dur && t.dist && l.dur && l.dist) {
      paceCompare = ` · pace: ${formatPace(t.dist, t.dur)} (semana passada ${formatPace(l.dist, l.dur)})`;
    }
    el.innerHTML = `<div class="th-suggestion">essa semana: ${avgDistThis.toFixed(1)}km${paceCompare} · semana passada: ${avgDistLast.toFixed(1)}km (${diffDist >= 0 ? '+' : ''}${diffDist.toFixed(1)}km)</div>`;
  } catch (e) { el.innerHTML = ''; }
}

async function loadAndRenderRunSuggestion(dayKey) {
  const el = document.getElementById('runSuggest-' + dayKey);
  if (!el) return;
  try {
    const { data, error } = await sb.from('run_logs').select('rpe, log_date').eq('day_key', dayKey).order('log_date', { ascending: false }).limit(2);
    if (error) throw error;
    const rows = (data || []).filter(r => r.rpe != null);
    if (rows.length < 2) { el.innerHTML = ''; return; }
    const allLow = rows.every(r => r.rpe <= 4);
    const allHigh = rows.every(r => r.rpe >= 8);
    if (allLow && currentWeek < runProgression.length) {
      el.innerHTML = `<div class="th-run-suggest">💡 os últimos treinos pareceram fáceis — quer avançar pra semana ${currentWeek + 1}?
        <button class="th-suggest-btn" id="advanceWeekBtn">Avançar</button></div>`;
      document.getElementById('advanceWeekBtn').addEventListener('click', () => changeWeek(1));
    } else if (allHigh) {
      el.innerHTML = `<div class="th-run-suggest">💡 os últimos treinos pareceram difíceis — quer manter a semana ${currentWeek}?
        <button class="th-suggest-btn" id="repeatWeekBtn">Manter</button></div>`;
      document.getElementById('repeatWeekBtn').addEventListener('click', () => { el.innerHTML = ''; });
    } else {
      el.innerHTML = '';
    }
  } catch (e) { el.innerHTML = ''; }
}

// ============================================================
// Modo treino ao vivo
// ============================================================
function openLiveMode(day) {
  liveList = (exercisesByDay[day.key] || []).slice().sort((a, b) => a.order_index - b.order_index);
  if (!liveList.length) return;
  liveIndex = 0;
  liveOpen = true;
  ensureLiveOverlay();
  renderLive();
  document.getElementById('liveOverlay').setAttribute('data-open', 'true');
}

function closeLiveMode() {
  liveOpen = false;
  const overlay = document.getElementById('liveOverlay');
  if (overlay) overlay.setAttribute('data-open', 'false');
}

function renderLive() {
  const ex = liveList[liveIndex];
  const content = document.getElementById('liveContent');
  if (!content || !ex) return;
  const doneForEx = todaySetLogs[ex.id] || {};
  const dots = Array.from({ length: ex.sets || 0 }).map((_, i) => {
    const setNum = i + 1;
    const log = doneForEx[setNum];
    const label = log ? `${log.weight}×${log.reps}` : setNum;
    return `<button class="th-dot" data-live-ex="${ex.id}" data-live-set="${setNum}" data-done="${!!log}" style="${log ? 'background:var(--green);border-color:transparent;' : ''}">${label}</button>`;
  }).join('');

  const variant = selectedVariant[ex.id];
  content.innerHTML = `
    <div class="th-live-counter">Exercício ${liveIndex + 1} / ${liveList.length}</div>
    <div class="th-live-name">${ex.name}${variant ? ` <span style="color:var(--muted);font-size:16px">— ${variant} (alt)</span>` : ''}</div>
    <div class="th-live-scheme">${ex.scheme || ''}</div>
    <div class="th-dots th-live-dots">${dots}</div>
    ${ex.note ? `<div class="th-ex-note">${ex.note}</div>` : ''}
  `;
  content.querySelectorAll('[data-live-ex]').forEach(dot => {
    dot.addEventListener('click', () => logSet(dot.getAttribute('data-live-ex'), parseInt(dot.getAttribute('data-live-set'), 10)));
  });
  document.getElementById('livePrev').disabled = liveIndex === 0;
  document.getElementById('liveNext').disabled = liveIndex === liveList.length - 1;
}

// ============================================================
// Tela de progresso: streak + peso corporal

async function renderProgressView() {
  root.innerHTML = `
    <div class="th-eyebrow">João · Treino Híbrido</div>
    <div class="th-title">Progresso</div>
    <button class="th-back-btn" id="backToDay">← Voltar ao treino</button>
    <div class="th-card" id="streakCard"><div class="th-loading">Carregando…</div></div>
    <div class="th-card" id="runLogCard"><div class="th-loading">Carregando…</div></div>
    <div class="th-card" id="bodyCard"><div class="th-loading">Carregando…</div></div>
    <div class="th-hint" id="thStatus">Conectado ao banco ✓</div>
  `;
  document.getElementById('backToDay').addEventListener('click', () => {
    currentView = 'day';
    renderShell();
    renderDay();
  });
  await renderStreak();
  await renderRunLogsSection();
  await renderBodySection();
}

async function renderRunLogsSection() {
  const card = document.getElementById('runLogCard');
  try {
    const { data, error } = await sb.from('run_logs').select('*').order('log_date', { ascending: false }).limit(20);
    if (error) throw error;
    const rows = data || [];
    card.innerHTML = `<div class="th-section-label" style="margin-top:0">Corridas registradas</div>` +
      (rows.length
        ? `<div class="th-body-list">${rows.map(r => {
            const dayName = (days.find(d => d.key === r.day_key) || {}).name || r.day_key;
            return `<div class="th-body-list-row">
              <span>${formatDate(r.log_date)} · ${dayName}</span>
              <span><b>${r.distance_km != null ? r.distance_km + 'km' : '—'}</b>${r.duration_min ? ' · ' + r.duration_min + 'min' : ''}${r.rpe ? ' · RPE ' + r.rpe : ''}${r.avg_heart_rate ? ' · ' + r.avg_heart_rate + 'bpm' : ''}
                <button class="th-history-edit" data-edit-run="${r.id}">✎</button>
                <button class="th-history-del" data-del-run="${r.id}">🗑</button>
              </span>
            </div>`;
          }).join('')}</div>`
        : `<div class="th-history-empty">Ainda sem corridas registradas.</div>`);
    card.querySelectorAll('[data-edit-run]').forEach(btn => btn.addEventListener('click', () => editRunLog(btn.getAttribute('data-edit-run'))));
    card.querySelectorAll('[data-del-run]').forEach(btn => btn.addEventListener('click', () => deleteRunLog(btn.getAttribute('data-del-run'))));
  } catch (e) {
    card.innerHTML = `<div class="th-history-empty">Não consegui carregar as corridas: ${e.message || e}</div>`;
  }
}

async function editRunLog(id) {
  try {
    const { data, error } = await sb.from('run_logs').select('*').eq('id', id).single();
    if (error) throw error;
    const distInput = prompt('Distância percorrida (km):', data.distance_km ?? '');
    if (distInput === null) return;
    const durInput = prompt('Tempo (minutos):', data.duration_min ?? '');
    const rpeInput = prompt('Esforço percebido, de 1 (fácil) a 10 (máximo):', data.rpe ?? '');
    const hrInput = prompt('Frequência cardíaca média (bpm), deixe em branco se não souber:', data.avg_heart_rate ?? '');
    const distance_km = parseFloat((distInput || '').replace(',', '.')) || null;
    const duration_min = parseFloat((durInput || '').replace(',', '.')) || null;
    const rpe = parseInt(rpeInput, 10) || null;
    const avg_heart_rate = hrInput && hrInput.trim() !== '' ? parseInt(hrInput, 10) || null : null;
    if (!confirm(`Confirmar edição: ${distance_km ?? '—'}km${duration_min ? ' em ' + duration_min + 'min' : ''}${rpe ? ' · RPE ' + rpe : ''}${avg_heart_rate ? ' · FC média ' + avg_heart_rate + 'bpm' : ''}?`)) return;
    const { error: upErr } = await sb.from('run_logs').update({ distance_km, duration_min, rpe, avg_heart_rate }).eq('id', id);
    if (upErr) throw upErr;
    setStatus(true);
    await renderRunLogsSection();
  } catch (e) { setStatus(false, 'Não consegui editar a corrida: ' + (e.message || e)); }
}

async function deleteRunLog(id) {
  if (!confirm('Apagar esse registro de corrida? Essa ação não pode ser desfeita.')) return;
  try {
    const { error } = await sb.from('run_logs').delete().eq('id', id);
    if (error) throw error;
    setStatus(true);
    await renderRunLogsSection();
    refreshWeekSummary();
  } catch (e) { setStatus(false, 'Não consegui apagar a corrida: ' + (e.message || e)); }
}

async function renderStreak() {
  const card = document.getElementById('streakCard');
  try {
    const [{ data: setDates, error: e1 }, { data: runDates, error: e2 }, { data: skippedRows, error: e3 }] = await Promise.all([
      sb.from('set_logs').select('log_date'),
      sb.from('run_logs').select('log_date'),
      sb.from('skipped_days').select('log_date'),
    ]);
    if (e1) throw e1;
    if (e2) throw e2;
    if (e3) throw e3;
    const countMap = {};
    [...(setDates || []), ...(runDates || [])].forEach(r => {
      if (!r.log_date) return;
      countMap[r.log_date] = (countMap[r.log_date] || 0) + 1;
    });
    const skippedSet = new Set((skippedRows || []).map(r => r.log_date));
    const streak = computeStreak(countMap, skippedSet);
    card.innerHTML = `
      <div class="th-streak-head">
        <div class="th-section-label" style="margin:0">Dias treinados</div>
        <div class="th-streak-count"><b>${streak}</b> ${streak === 1 ? 'dia seguido' : 'dias seguidos'}</div>
      </div>
      ${renderStreakGrid(countMap, skippedSet)}
    `;
  } catch (e) {
    card.innerHTML = `<div class="th-history-empty">Não consegui carregar o histórico de treinos: ${e.message || e}</div>`;
  }
}

function computeStreak(countMap, skippedSet) {
  let streak = 0;
  let cursor = new Date(todayStr + 'T12:00:00');
  if (!countMap[todayStr] && !skippedSet.has(todayStr)) cursor.setDate(cursor.getDate() - 1);
  while (true) {
    const key = cursor.toISOString().slice(0, 10);
    if (countMap[key]) { streak++; cursor.setDate(cursor.getDate() - 1); }
    else if (skippedSet.has(key)) { cursor.setDate(cursor.getDate() - 1); }
    else break;
  }
  return streak;
}

function renderStreakGrid(countMap, skippedSet) {
  const totalDays = 112;
  const start = new Date(todayStr + 'T12:00:00');
  start.setDate(start.getDate() - (totalDays - 1));
  const cells = [];
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    const key = d.toISOString().slice(0, 10);
    const c = countMap[key] || 0;
    const skipped = skippedSet.has(key);
    const level = skipped ? 'skip' : (c === 0 ? 0 : c === 1 ? 1 : c === 2 ? 2 : 3);
    const label = skipped ? 'pulado de propósito' : `${c} registro(s)`;
    cells.push(`<div class="th-streak-cell" data-level="${level}" title="${formatDate(key)}: ${label}"></div>`);
  }
  return `<div class="th-streak-grid">${cells.join('')}</div>`;
}

async function renderBodySection() {
  const card = document.getElementById('bodyCard');
  card.innerHTML = `
    <div class="th-section-label" style="margin-top:0">Idade</div>
    <div class="th-age-row">
      <input type="number" id="ageInput" placeholder="Idade" value="${userAge != null ? userAge : ''}">
      <button id="ageSaveBtn">Salvar</button>
    </div>
    <div class="th-suggestion" id="ageStatus">${userAge != null ? `Idade atual: ${userAge} anos` : ''}</div>
    <div class="th-section-label">Peso corporal</div>
    <div class="th-body-form">
      <input type="date" id="bmDate" value="${todayStr}">
      <input type="number" step="0.1" id="bmWeight" placeholder="Peso (kg)">
      <input type="number" step="0.1" id="bmWaist" placeholder="Cintura (cm) opcional">
      <input type="number" step="0.1" id="bmArm" placeholder="Braço (cm) opcional">
      <button id="bmSave">Salvar</button>
    </div>
    <canvas id="bmChart" height="160"></canvas>
    <div class="th-body-list" id="bmList"></div>
  `;
  document.getElementById('ageSaveBtn').addEventListener('click', saveUserAge);
  document.getElementById('bmSave').addEventListener('click', saveBodyMeasurement);
  await loadAndRenderBodyMeasurements();
}

async function saveUserAge() {
  const val = parseInt(document.getElementById('ageInput').value, 10);
  if (!val || val < 1 || val > 120) { alert('Informe uma idade válida.'); return; }
  if (!confirm(`Confirmar idade: ${val} anos?`)) return;
  try {
    const { error } = await sb.from('settings').upsert({ key: 'user_age', value: String(val) });
    if (error) throw error;
    userAge = val;
    setStatus(true);
    document.getElementById('ageStatus').textContent = `Idade atual: ${val} anos`;
  } catch (e) { setStatus(false, 'Não consegui salvar a idade: ' + (e.message || e)); }
}

async function saveBodyMeasurement() {
  const date = document.getElementById('bmDate').value || todayStr;
  const weight = parseFloat((document.getElementById('bmWeight').value || '').replace(',', '.'));
  const waist = parseFloat((document.getElementById('bmWaist').value || '').replace(',', '.'));
  const arm = parseFloat((document.getElementById('bmArm').value || '').replace(',', '.'));
  if (!weight) { alert('Informe o peso (kg).'); return; }
  const waistOk = !isNaN(waist), armOk = !isNaN(arm);
  if (!confirm(`Confirmar: ${weight}kg em ${formatDate(date)}${waistOk ? ' · cintura ' + waist + 'cm' : ''}${armOk ? ' · braço ' + arm + 'cm' : ''}?`)) return;
  try {
    const { error } = await sb.from('body_measurements').upsert({
      date, weight_kg: weight,
      waist_cm: waistOk ? waist : null,
      arm_cm: armOk ? arm : null,
    });
    if (error) throw error;
    setStatus(true);
    await loadAndRenderBodyMeasurements();
  } catch (e) { setStatus(false, 'Não consegui salvar a medida: ' + (e.message || e)); }
}

async function editBodyMeasurement(date) {
  try {
    const { data, error } = await sb.from('body_measurements').select('*').eq('date', date).single();
    if (error) throw error;
    document.getElementById('bmDate').value = data.date;
    document.getElementById('bmWeight').value = data.weight_kg ?? '';
    document.getElementById('bmWaist').value = data.waist_cm ?? '';
    document.getElementById('bmArm').value = data.arm_cm ?? '';
    document.getElementById('bmDate').scrollIntoView({ behavior: 'smooth', block: 'center' });
  } catch (e) { setStatus(false, 'Não consegui carregar essa medida: ' + (e.message || e)); }
}

async function deleteBodyMeasurement(date) {
  if (!confirm('Apagar o registro de peso de ' + formatDate(date) + '? Essa ação não pode ser desfeita.')) return;
  try {
    const { error } = await sb.from('body_measurements').delete().eq('date', date);
    if (error) throw error;
    setStatus(true);
    await loadAndRenderBodyMeasurements();
  } catch (e) { setStatus(false, 'Não consegui apagar essa medida: ' + (e.message || e)); }
}

async function loadAndRenderBodyMeasurements() {
  const listEl = document.getElementById('bmList');
  const canvasEl = document.getElementById('bmChart');
  try {
    const { data, error } = await sb.from('body_measurements').select('*').order('date', { ascending: true });
    if (error) throw error;
    const rows = data || [];
    if (!rows.length) {
      listEl.innerHTML = '<div class="th-history-empty">Ainda sem registros de peso.</div>';
      canvasEl.style.display = 'none';
      return;
    }
    canvasEl.style.display = 'block';
    if (bmChart) bmChart.destroy();
    bmChart = new Chart(canvasEl.getContext('2d'), {
      type: 'line',
      data: {
        labels: rows.map(r => formatDate(r.date)),
        datasets: [{
          label: 'Peso (kg)',
          data: rows.map(r => r.weight_kg),
          borderColor: themeColor('--green'),
          backgroundColor: themeColor('--green'),
          tension: 0.25,
          pointRadius: 3,
        }],
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: themeColor('--muted'), font: { size: 10 } }, grid: { color: themeColor('--line') } },
          y: { ticks: { color: themeColor('--muted'), font: { size: 10 } }, grid: { color: themeColor('--line') } },
        },
      },
    });
    listEl.innerHTML = rows.slice(-10).reverse().map(r =>
      `<div class="th-body-list-row">
        <span>${formatDate(r.date)}</span>
        <span><b>${r.weight_kg}kg</b>${r.waist_cm ? ` · cintura ${r.waist_cm}cm` : ''}${r.arm_cm ? ` · braço ${r.arm_cm}cm` : ''}
          <button class="th-history-edit" data-edit-bm="${r.date}">✎</button>
          <button class="th-history-del" data-del-bm="${r.date}">🗑</button>
        </span>
      </div>`
    ).join('');
    listEl.querySelectorAll('[data-edit-bm]').forEach(btn => btn.addEventListener('click', () => editBodyMeasurement(btn.getAttribute('data-edit-bm'))));
    listEl.querySelectorAll('[data-del-bm]').forEach(btn => btn.addEventListener('click', () => deleteBodyMeasurement(btn.getAttribute('data-del-bm'))));
  } catch (e) {
    listEl.innerHTML = `<div class="th-history-empty">Não consegui carregar o histórico de peso: ${e.message || e}</div>`;
  }
}

init();
</script>
</body>
</html>
